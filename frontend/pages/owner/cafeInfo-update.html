<!DOCTYPE html>
<html lang="en">
<header>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../resources/css/header-style.css">
    <link rel="stylesheet" href="../../resources/css/cafeInfo-update.css">

    <div id="header"></div>
    <script src="../../resources/js/script-header-owner.js"></script>
</header>

<body>
    <div class="body-box">
        <h1 class="cafe-name">Coffee Bun</h1>

        <button type="button" class="update-btn">Update</button>

        <section class="info-box">
            <div class="pic-column">
                <img src="../../resources/imgs/gf.png" alt="pookie">
                
                <button type="button" class="form-btn cover-btn">Change Cover Photo</button>
            </div>

            <div class="info-column">
                <button type="button" class="form-btn">Edit Photos</button>
                
                <div class="info-text">
                    <input type="text" class="form-btn" placeholder="Update WiFi Speed">
                    <input type="text" class="form-btn" placeholder="Update No. of Outlets">
                </div>

                <input type="text" class="form-btn" placeholder="Update Operating Hours">
                <input type="text" class="form-btn" placeholder="Update Price Range">
            </div>
        </section>
    </div>
    
</body>

</html>
