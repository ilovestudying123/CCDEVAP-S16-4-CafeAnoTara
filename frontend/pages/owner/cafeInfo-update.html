<!DOCTYPE html>
<html lang="en">
<header>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../resources/css/header-style.css">
    <link rel="stylesheet" href="../../resources/css/cafeInfo-update.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Montagu+Slab:opsz,wght@16..144,100..700&display=swap" rel="stylesheet">

    <div id="header"></div>
    <script src="../../resources/js/script-header-owner.js"></script>
</header>

<body>
    <div class="body-box">
        <h1 class="cafe-name">Coffee Bun</h1>

        <button type="button" id="save-btn" class="update-btn">Update</button>

        <section class="info-box">
            <div class="pic-column">
                <img src="../../resources/imgs/cafe.jpg" alt="pookie">
                
                <button type="button" class="form-btn cover-btn">Change Cover Photo</button>
            </div>

            <div class="info-column">
                <button type="button" class="form-btn edit-btn">Edit Photos</button>
                
                <div class="info-text">
                    <input type="text" id="input-wifi" class="form-btn" placeholder="Update WiFi Speed">
                    <input type="text" id="input-outlets" class="form-btn" placeholder="Update No. of Outlets">
                </div>

                <input type="text" id="input-hours" class="form-btn" placeholder="Update Operating Hours">
                <input type="text" id="input-price" class="form-btn" placeholder="Update Price Range">
            </div>
        </section>
    </div>
    
    <script src="../../resources/js/cafeInfo.js"></script>
</body>

</html>
