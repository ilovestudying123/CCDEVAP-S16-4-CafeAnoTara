<!DOCTYPE html>
<html lang="en">
<header>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../resources/css/header-style.css">
    <link rel="stylesheet" href="../../resources/css/cafeInfo.css">

    <div id="header"></div>
    <script src="cafeInfo.js"></script>
</header>

<body>
    <div class="body-box">
        <h1 class="cafe-name">Coffee Bun</h1>
        
        <a href="cafeInfo-update.html" class="update-btn">Update Profile</a>

        <section class="info-box">
            <div class="pic-column">
                <div class="cafe-pic">
                    <img src="../../resources/imgs/gf.png" alt="Main Cafe Image">
                </div>
            </div>

            <div class="info-column">
                <div class="grid-container">
                    <div class="grid-item">
                        <span class="header-text">Wifi Speed</span>
                        <span class="desc-text">100 Mbps</span>
                    </div>
                    <div class="grid-item">
                        <span class="header-text">Operating Hours</span>
                        <span class="desc-text">8:00 AM - 7:00 PM</span>
                    </div>
                    <div class="grid-item">
                        <span class="header-text">Price Range</span>
                        <span class="desc-text">$-$$</span>
                    </div>
                    <div class="grid-item">
                        <span class="header-text">No. of Outlets</span>
                        <span class="desc-text">10</span>
                    </div>
                </div>

                <div class="thumbnails-row">
                    <img src="../../resources/imgs/gf.png" alt="Thumb 1" class="thumb">
                    <img src="../../resources/imgs/gf.png" alt="Thumb 2" class="thumb">
                    <img src="../../resources/imgs/gf.png" alt="Thumb 3" class="thumb">
                </div>
            </div>
        </section>
    </div>
</body>

</html>
