<!DOCTYPE html>
<html lang="en">
<header>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../resources/css/header-style.css">
    <link rel="stylesheet" href="../../resources/css/owner-ratings.css">

    <div id="header"></div>
    <script src="../../resources/js/script-header-owner.js"></script>
</header>

<body>
    <div class="body-box">
        <h1 class="cafe-name">Coffee Bun</h1>

        <div class="grid-btn">
            <button type="button" class="filter-btn">Filter</button>
            <button type="button" class="sort-btn">Sort</button>
        </div>

        <div id="reviews-list">

        <section class="rating-box">
            <div class="review-card">
                <div class="review-img">
                    <img src="../../resources/imgs/cafe.jpg" alt="meow">
                </div>
                
                <div class="review-text">
                    <div class="review-header">
                        <p class="review-title"><b>It is good for students</b></p>
                        <button type="button" id="report-btn">Report</button>
                    </div>
                    
                    <p class="rating">4/5 Stars</p>
                    <p class="review-body">I liked this cafe it has fast wifi</p>
                    
                    <div class="review-reply">
                        <textarea id="reply-text" placeholder="Add reply"></textarea>
                        <button type="button" id="submit-btn">Submit</button>
                    </div>
                </div>
            </div>
        </section>

        </div>

    </div>

</body>

</html>
