<!DOCTYPE html>
<html>
<head>
    <title>Edit Account Details</title>
    <script src="accountSettings.js" defer></script>
</head>
<body>

    <h1>Edit Account Details</h1>

    <form>
    <input type="checkbox" onclick="toggle('username', this)">
    <label>Username:</label>
    <input type="text" id="username" value="j_delacruz123" disabled>
    <br><br>

    <input type="checkbox" onclick="toggle('email', this)">
    <label>Email:</label>
    <input type="email" id="email" value="juan.delacruz@gmail.com" disabled>
    <br><br>

    <input type="checkbox" onclick="toggle('firstName', this)">
    <label>First Name:</label>
    <input type="text" id="firstName" value="Juan" disabled>
    <br><br>

    <input type="checkbox" onclick="toggle('lastName', this)">
    <label>Last Name:</label>
    <input type="text" id="lastName" value="Dela Cruz" disabled>
    <br><br>

    <input type="checkbox" onclick="toggle('contactNumber', this)">
    <label>Contact Number:</label>
    <input type="text" id="contactNumber" value="09123456789" disabled>
    <br><br>

    <input type="checkbox" onclick="toggle('password', this)">
    <label>Password:</label>
    <input type="password" id="password" value="juan2345!" disabled>
    <br><br>

    <button type="button" onclick="saveChanges();">Save Changes</button>

    </form>

</body>
</html>
