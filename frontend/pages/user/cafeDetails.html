<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../resources/css/user-cafeDetails.css">
</head>
<body>
    
    <section>
        <div class="cafe">

            <div class="name-bookmark">
                <div class="cafe-name">
                    <h3>Cafe W</h3>
                    <p>123 Main Street, Bonifacio Global City, Taguig City</p>
                </div>
                <div class="cafe-bookmark">
                    <button id="bookmark-button" type="button" onclick="bookmarkCafe()"><i class="fa-solid fa-bookmark"></i></button>
                </div>
            </div>

            <div class="cafe-details">
                <div class="cafe-mainImg">
                    <img src="../../resources/imgs/cafe.jpg" alt="Cafe 1">
                </div>
                <div class="cafe-description">
                    <p>Wifi speed: 100Mbps No. of outlets: 8</p>
                    <p>Price range: $-$$  Noise Level: Moderate</p>
                    <p>Opening hoursL 7:30 am - 10:00 pm</p>
                    <div class = "desc-box">
                        <p>Description</p>
                    </div>
                </div>
            </div>
            
            <p>Additional Images:</p>
            <div class = "cafe-images">
                <div class="images">
                     <img src="../../resources/imgs/cafe.jpg" alt="Cafe 1">
                </div>
                <div class="images">
                     <img src="../../resources/imgs/cafe.jpg" alt="Cafe 1">
                </div>
                <div class="images">
                     <img src="../../resources/imgs/cafe.jpg" alt="Cafe 1">
                </div>
                <div class="images">
                     <img src="../../resources/imgs/cafe.jpg" alt="Cafe 1">
                </div>
            </div>

        </div>
    </section>
</body>
</html>
