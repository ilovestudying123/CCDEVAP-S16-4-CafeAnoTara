<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <link rel="stylesheet" href="accountSettings.css" <-- Link to CSS file for styling -->>
    <script src="accountSettings.js" defer></script>
</head>
<body>
    <div class="account-settings">
        <h1>Account Settings</h1>
        <form>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" value="j_delacruz123" disabled>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="juan.delacruz@gmail.com" disabled>
            <br><br>

            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" value="Juan" disabled>


            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" value="Dela Cruz" disabled>
            <br><br>

            <label for="contactNumber">Contact Number:</label>
            <input type="text" id="contactNumber" name="contactNumber" value="09123456789" disabled>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" value="juan2345!" disabled>
            <br><br><br>
            <button type="button" onclick="goToEditPage();">Edit</button>

            <script>
            function goToEditPage() {
                window.location.href = "editAccountDetails.html";
            }
            </script>
        </form>
    </div>
</body>
</html>
