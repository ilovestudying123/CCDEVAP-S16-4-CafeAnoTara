<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="forgotPassword.css">
</head>
<body>
    <div class="header">
    <h1 class="title">Cafe Tayo, Ano Tara?</h1>
    </div>
    <div class="content">
        <section class="trending">
            <h3 class="trend">Trending Cafes:</h3>

            <div class="photo-row">
                <div class="photo-group">
                    <img src="yardstick.png" alt="Top 1" width="100" height="100"/>
                    <h5>Yardstick Coffee</h5>
                </div>
                <div class="photo-group">                    
                    <img src="sb.png" alt="Top 2" width="100" height="100"/>
                    <h5>Starbucks</h5>
                </div>    
                <div class="photo-group">   
                    <img src="cbtl.png" alt="Top 3" width="100" height="150"/>
                    <h5>Coffee Bean & Tea Leaf</h5>
                </div>
            </div>
        
        </section>

        <aside class="resetPass">    
            <h3>Forgot Password</h3>
            <form id="loginForm">
                <p>Enter your email to reset your password.</p>
                <label for="username">Email </label>
                <input type="text" id="username" name="username" required>
                <label for="newpassword">New Password</label>
                <input type="password" id="newpasword" name="newpassword" required>
                <label for="newpassword">Confirm New Password</label>
                <input type="password" id="confnewpasword" name="confnewpassword" required><br><br>

                <button type="button" onclick="checkPass();">Submit</button>
                <p>Don't have an account? <a href="signUp.html">Sign up</a></p>
            </form>
        </aside>  
    </div>    
</body>
</html>
