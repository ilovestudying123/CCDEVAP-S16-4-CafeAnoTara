<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../../resources/css/login.css">
    <script src="../../resources/js/login.js"></script>
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<div class="whole">
    <div class="header">
    <h1 class="title">Cafe Tayo, Ano Tara?</h1>
    </div>

    
    <div class="content">
        <section class="trending">
            <h3 class="trend">Trending Cafes:</h3>

            <div class="photo-row">
                <div class="photo-group">
                    <img src="../../resources/imgs/yardstick.jpg" alt="Top 1" width="100" height="100"/>
                    <h5>Yardstick Coffee</h5>
                </div>
                <div class="photo-group">                    
                    <img src="../../resources/imgs/starbucks.jpg" alt="Top 2" width="100" height="100"/>
                    <h5>Starbucks</h5>
                </div>    
                <div class="photo-group">   
                    <img src="../../resources/imgs/cbtl.jpg" alt="Top 3" width="100" height="150"/>
                    <h5>Coffee Bean & Tea Leaf</h5>
                </div>
            </div>
        
        </section>

        <aside class="logIn">    
            <h4 class="loginCaption">Find your perfect study cafe!</h4>
            <form id="loginForm">
                <label for="username">Email/Username</label><br>
                <input type="text" id="username" name="username" required>
                <br><br>
                <label for="password">Password</label>

                <div class="password-container">
                    <input type="password" id="password" name="password" required>

                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

                <div class="fPass">
                <a href="../authentication/forgotPassword.html">Forgot Password?</a>
                </div>
                <br><br>

                <button type="button" class="login-btn" onclick="checkUser()">Sign In
                </button>
                <br>
                    <p>Don't have an account? <a href="../authentication/signUp.html">Sign up</a></p>
            </form>
        </aside>  
    </div> 
</div>       
</body>
</html>
