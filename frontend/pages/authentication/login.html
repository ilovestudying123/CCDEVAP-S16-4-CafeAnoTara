<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css"> <!-- Link to CSS file for styling -->
    <script src="login.js" defer></script>
</head>
<body>
    <h1>Cafe, Ano Tara?</h1>

<section>
    <h3>Trending Cafes:</h3>

    <p>Yardstick Coffee</p>
    <img src="yardstick.png" alt="Top 1" width="100" height="100"/>
    <p>Starbucks</p>
    <img src="sb.png" alt="Top 2" width="100" height="100"/>
    <p>Coffee Bean & Tea Leaf</p>
    <img src="cbtl.png" alt="Top 3" width="100" height="150"/>
</section>

<aside>    
    <h4>Find your perfect study cafe!</h4>
    <form id="loginForm">
        <label for="username">Email/Username</label><br>
        <input type="text" id="username" name="username" required>
        <br><br>
        <label for="password">Password</label><br>
        <input type="password" id="password" name="password" required>
        <br>
        <a href="forgotPassword.html">Forgot Password?</a>
        <br><br>

        <!--Check database which user is trying to log in to determine their dashboard -->
        <button type="button" onclick="checkUser()">Sign In</button>
        <br>
        <p>Don't have an account? <a href="signUp.html">Sign up</a></p>
    </form>
</aside>  
</body>
</html>
