<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../../resources/css/login.css">
    <script src="../../resources/js/login.js" defer></script>
</head>
<body>

    <div class="header">
    <h1 class="title">Cafe Tayo, Ano Tara?</h1>
    </div>

    <script src="script-header-user.js"></script>

    <div class="content">
        <section class="trending">
            <h3 class="trend">Trending Cafes:</h3>

            <div class="photo-row">
                <div class="photo-group">
                    <img src="yardstick.png" alt="Top 1" width="100" height="100"/>
                    <h5>Yardstick Coffee</h5>
                </div>
                <div class="photo-group">                    
                    <img src="sb.png" alt="Top 2" width="100" height="100"/>
                    <h5>Starbucks</h5>
                </div>    
                <div class="photo-group">   
                    <img src="cbtl.png" alt="Top 3" width="100" height="150"/>
                    <h5>Coffee Bean & Tea Leaf</h5>
                </div>
            </div>
        
        </section>

        <aside class="logIn">    
            <h4 class="loginCaption">Find your perfect study cafe!</h4>
            <form id="loginForm">
                <label for="username">Email/Username</label><br>
                <input type="text" id="username" name="username" required>
                <br><br>
                <label for="password">Password</label><br>
                <input type="password" id="password" name="password" required>
                <br>
                <div class="fPass">
                <a href="forgotPassword.html">Forgot Password?</a>
                </div>
                <br><br>

                <button type="button" onclick="checkUser()">Sign In</button>
                <br>
                    <p>Don't have an account? <a href="signUp.html">Sign up</a></p>
            </form>
        </aside>  
    </div>    
</body>
</html>
