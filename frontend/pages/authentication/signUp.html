<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="../../resources/css/signUp.css"> <!-- Link to CSS file for styling -->    
    <script src="../../resources/js/signUp.js" defer></script>
</head>
<body>
    <div class="header">
    <h1 class="title">Cafe Tayo, Ano Tara?</h1>
    </div>

    <div class="content">
        <section class="trending">
            <h3 class="trend">Trending Cafes:</h3>

            <div class="photo-row">
                <div class="photo-group">
                    <img src="yardstick.png" alt="Top 1" width="100" height="100"/>
                    <h5>Yardstick Coffee</h5>
                </div>
                <div class="photo-group">                    
                    <img src="sb.png" alt="Top 2" width="100" height="100"/>
                    <h5>Starbucks</h5>
                </div>    
                <div class="photo-group">   
                    <img src="cbtl.png" alt="Top 3" width="100" height="150"/>
                    <h5>Coffee Bean & Tea Leaf</h5>
                </div>
            </div>
        
        </section>

<aside class="signUp">
    <h4 class="signUpCaption">Become a member today!</h4>
    <form id="signUpForm">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

        <div class="name-row">
            <div>
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>

            <div>
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>
        </div>

        <div class="password-row">
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div>
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
        </div>

        <div class="user-type">
            <label>User Type</label>

            <div class="radio-row">
                <div class="radio-group">
                    <input type="radio" id="ownerType" name="userType" value="Owner" required>
                    <label for="ownerType">Owner</label>
                </div>
                <div class="radio-group">
                    <input type="radio" id="customerType" name="userType" value="Customer" required>
                    <label for="customerType">Customer</label>
                </div>
            </div>
        </div>
        
        <button type="submit">Create Account</button>
        <br>
        <p>Already have an account? <a href="login.html">Sign in</a></p>
    </form>
</aside>  
</div>
</body>
</html>
