<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
</head>
<body>
    <h1>Cafe, Ano Tara?</h1>

<section>
    <h3>Trending Cafes:</h3>

    <p>Yardstick Coffee</p>
    <img src="yardstick.png" alt="Top 1" width="100" height="100"/>
    <p>Starbucks</p>
    <img src="sb.png" alt="Top 2" width="100" height="100"/>
    <p>Coffee Bean & Tea Leaf</p>
    <img src="cbtl.png" alt="Top 3" width="100" height="150"/>
</section>

<aside>    
    <h4>Become a member today!</h4>
    <form id="signUpForm">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
        <br>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" required>
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" required>
        <br>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>
        <br><br>

        <label for="userType">User Type</label><br>
        <input type="radio" id="ownerType" name="userType" value="Owner" required>
        <label for="ownerType">Owner</label>
        <input type="radio" id="customerType" name="userType" value="Customer" required>
        <label for="customerType">Customer</label><br><br>

        <!--Check which user type is selected to determine which dashboard to display-->
        <button type="submit">Create Account</button>
        <br>
        <p>Already have an account? <a href="login.html">Sign in</a></p>
    </form>
</aside>  
</body>
</html>
