<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../resources/css/header-style.css">
    <link rel="stylesheet" href="../../resources/css/admin-cafe-verification.css">
    <script src="../../resources/js/script-header-admin.js"></script>
</head>

<body>
    <div id="header"></div>

    <div class="body-box">
        <div class="search-section">
            <h1>Cafe Verification</h1>

            <div class="search-box">
                <div class="search-input">
                    <img src="../../resources/imgs/magnifying-glass-solid.png" alt="search icon">
                    <input type="search" placeholder="Enter cafe">
                </div>

                <div class="filter">
                    <button id="filter-button" onclick="toggleFilter()">
                    <img src="../../resources/imgs/sliders-solid.png" class="sort-icon">Filter</button>

                    <div id="filter-options">
                        <p>Status:</p>
                        <label><input type="radio" name="status" value="pending"> Pending</label><br>
                        <label><input type="radio" name="status" value="approved"> Approved</label><br>
                        <label><input type="radio" name="status" value="denied"> Denied</label>

                        <div class="filter-buttons">
                            <button type="button" onclick="applyFilter()">Apply</button>
                            <button type="button" onclick="clearFilter()">Clear</button>
                        </div>
                    </div>
                </div>
                <button id="sort-button" type="button" onclick="toggleSort()">
                <img src="../../resources/imgs/sort-solid.png" class="sort-icon">Sort</button>
            </div>
        </div>

        <div class="card-holder">
            <section class="cafe-card">
                <div class="cafe-info">
                    <img src="../../resources/imgs/cafe1.png" alt="cafe1">

                    <div class="cafe-details">
                        <h1>Cafe Veranda</h1>
                        <p>ABC Main Street, Bonifacio Global City, Taguig City</p>
                    </div>
                </div>

                <div class="button-holder">
                    <button class="reject-btn" onclick="return confirm('Reject Cafe Application?')">Reject</button>
                    <button class="approve-btn" onclick="return confirm('Accept Cafe Application?')">Approve</button>
                </div>
            </section>

            <section class="cafe-card">
                <div class="cafe-info">
                    <img src="../../resources/imgs/cafe2.jpg" alt="cafe2">
                    
                    <div class="cafe-details">
                        <h1>Bo's Coffee</h1>
                        <p>Ground Floor, Activity Center, SM Mall of Asia, Pasay City</p>
                    </div>
                </div>

                <div class="button-holder">
                    <button class="reject-btn" onclick="return confirm('Reject Cafe Application?')">Reject</button>
                    <button class="approve-btn" onclick="return confirm('Accept Cafe Application?')">Approve</button>
                </div> 
            </section>

            <section class="cafe-card">
                <div class="cafe-info">
                    <img src="../../resources/imgs/cafe3.jpg" alt="cafe3">

                    <div class="cafe-details">
                        <h1>Cavetown</h1>
                        <p>281 Maginhawa Center, Maginhawa Street, Quezon City</p>
                    </div>
                </div>

                <div class="button-holder">
                    <button class="reject-btn" onclick="return confirm('Reject Cafe Application?')" >Reject</button>
                    <button class="approve-btn" onclick="return confirm('Accept Cafe Application?')">Approve</button>
                </div>   
            </section>
        </div>
    </div>
</body>
